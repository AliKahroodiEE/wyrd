name: wyrd
description: "Wyrd — your character is who you become."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^3.4.3
  go_router: ^18.1.2
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  intl: ^0.20.3
  shamsi_date: ^1.1.1
  fl_chart: ^1.3.0
  uuid: ^4.6.0
  supabase_flutter: ^2.18.3
  shared_preferences: ^2.5.6
  flutter_local_notifications: ^22.3.3
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  flutter_localizations:
    sdk: flutter
  wyrd_engine:
    path: ../packages/wyrd_engine
  http: ^1.6.0
  flutter_secure_storage: ^11.2.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  fake_async: ^1.3.3
  flutter_lints: ^6.0.0
  build_runner: ^2.17.1
  drift_dev: ^2.35.2

flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Variable.ttf
    - family: Cinzel
      fonts:
        - asset: assets/fonts/Cinzel-Variable.ttf
