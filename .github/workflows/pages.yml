name: Web demo (GitHub Pages)

# Builds the web app in demo mode (sample data seeded in the visitor's
# browser, nothing sent anywhere) and publishes it to GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # Pinned: newer stable releases deprecate package:flutter/material.dart
          # (moving to material_ui), which fails `flutter analyze --fatal-infos`.
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build web demo
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/" --dart-define=WYRD_DEMO=true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
